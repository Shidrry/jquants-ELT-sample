__metadata__:
  schedule:
    cron: "35 16 * * *"
    time_zone: "Asia/Tokyo"
    argument:
      args: {}
  jobs:
    - id: ingest_to_gcs
      py: workflows/ingest/jquants_ohlcv/job__ingest_to_gcs.py
      # Cloud Run Jobs は gen2 固定のため memory >= 512Mi, cpu >= 1 が下限
      memory: 512Mi
      cpu: "1"
      timeout: 300
    - id: load_to_bigquery
      py: workflows/ingest/jquants_ohlcv/job__load_to_bigquery.py
      # Cloud Run Jobs は gen2 固定のため memory >= 512Mi, cpu >= 1 が下限
      memory: 512Mi
      cpu: "1"
      timeout: 300
    - id: check_quality
      py: workflows/ingest/jquants_ohlcv/job__check_quality.py
      memory: 512Mi
      cpu: "1"
      timeout: 300

main:
  params: [args]
  steps:
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: REGION_PLACEHOLDER
          - base_job: ${"projects/" + project_id + "/locations/" + region + "/jobs/ENV_PLACEHOLDER--"}
          - base_service: ${"projects/" + project_id + "/locations/" + region + "/services/ENV_PLACEHOLDER--"}
          - logical_date: ${args.logical_date}

    - get_discord_webhook:
        call: googleapis.secretmanager.v1.projects.secrets.versions.access
        args:
          name: ${"projects/" + project_id + "/secrets/discord-webhook-url/versions/latest"}
        result: discord_secret

    - init_discord_url:
        assign:
          - discord_webhook_url: ${text.decode(base64.decode(discord_secret.payload.data))}

    - run_pipeline:
        try:
          steps:
            - get_market_open_service:
                call: googleapis.run.v2.projects.locations.services.get
                args:
                  name: ${base_service + "market-open"}
                result: market_open_svc

            - check_market_open:
                call: http.get
                args:
                  url: ${market_open_svc.uri + "/market-open?date=" + logical_date}
                  auth:
                    type: OIDC
                    audience: ${market_open_svc.uri}
                result: market_open_resp

            - branch_on_market_open:
                switch:
                  - condition: ${market_open_resp.body.market_open == true}
                    next: init_retry
                  - condition: ${true}
                    next: end

            # ---- ingest & 件数確認のリトライループ ----
            # bars/daily は営業日なら必ずレコードが返る。0 件の場合は API 更新遅延と判断してリトライ。
            # API 更新予定 16:30 + 5分 = 16:35 開始、5分間隔で最大 6 回リトライ（最大 30 分）。
            - init_retry:
                assign:
                  - retry_count: 0

            - run_job__ingest_to_gcs:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                  name: ${base_job + "jquants-ohlcv--ingest-to-gcs"}
                  body:
                    overrides:
                      containerOverrides:
                        - env:
                            - name: ENV_NAME
                              value: ENV_PLACEHOLDER
                            - name: LOGICAL_DATE
                              value: ${logical_date}

            - run_job__load_to_bigquery:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                  name: ${base_job + "jquants-ohlcv--load-to-bigquery"}
                  body:
                    overrides:
                      containerOverrides:
                        - env:
                            - name: ENV_NAME
                              value: ENV_PLACEHOLDER
                            - name: LOGICAL_DATE
                              value: ${logical_date}

            - count_records:
                call: googleapis.bigquery.v2.jobs.query
                args:
                  projectId: ${project_id}
                  body:
                    query: '${"SELECT COUNT(*) AS cnt FROM `" + project_id + ".staging_jquants_ENV_PLACEHOLDER.daily_quotes` WHERE Date = DATE(''" + logical_date + "'')"}'
                    useLegacySql: false
                result: count_resp

            - parse_count:
                assign:
                  - record_count: ${int(count_resp.rows[0].f[0].v)}

            - check_record_count:
                switch:
                  - condition: ${record_count > 0}
                    next: run_quality_check
                  - condition: ${retry_count >= 6}
                    next: zero_records_timeout
                  - condition: ${true}
                    next: retry_wait

            - retry_wait:
                call: sys.sleep
                args:
                  seconds: 300

            - retry_increment:
                assign:
                  - retry_count: ${retry_count + 1}
                next: run_job__ingest_to_gcs

            - zero_records_timeout:
                raise:
                  code: 503
                  message: '${"Zero records after max retries: bars/daily data not available (date=" + logical_date + ")"}'

        except:
          as: e
          steps:
            - build_discord_msg:
                assign:
                  - discord_msg: >-
                      ${"❌ **jquants_ohlcv 失敗** [ENV_PLACEHOLDER]\n"
                      + "project: `" + project_id + "`\n"
                      + "date: `" + logical_date + "`\n"}
            - notify_discord:
                call: http.post
                args:
                  url: ${discord_webhook_url}
                  body:
                    content: >-
                      ${discord_msg
                      + "step: `" + json.encode_to_string(default(map.get(e, "steps"), "N/A")) + "`\n"
                      + "tags: `" + json.encode_to_string(default(map.get(e, "tags"), [])) + "`\n"
                      + "code: `" + string(default(map.get(e, "code"), "N/A")) + "`\n"
                      + "message:\n```\n"
                      + text.substring(default(map.get(e, "message"), json.encode_to_string(e)), 0, 1400)
                      + "\n```"}
            - reraise:
                raise: ${e}

    # メインパイプラインの try 外に配置。データ品質警告（Discord 通知）は非 fatal だが、
    # 処理エラー（BQ 接続失敗・コードバグ等）はジョブ失敗としてワークフローを失敗させる。
    - run_quality_check:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${base_job + "jquants-ohlcv--check-quality"}
          body:
            overrides:
              containerOverrides:
                - env:
                    - name: ENV_NAME
                      value: ENV_PLACEHOLDER
                    - name: LOGICAL_DATE
                      value: ${logical_date}
